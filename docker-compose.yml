version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: deen_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: deen_w_donya

  server:
    build: ./server
    container_name: deen_server
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./server/.env
    depends_on:
      - mongo
    environment:
      MONGODB_URI: mongodb://mongo:27017/deen_w_donya
      AI_SERVICE_URL: http://ai-service:8000

  ai-service:
    build: ./ai-service
    container_name: deen_ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./ai-service/.env

volumes:
  mongo_data:
